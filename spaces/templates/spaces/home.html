{% load static %}<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StudySmart · Dublin study spaces</title>
    <!-- Pinned CDN versions; integrity hashes make the browser reject altered files. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'spaces/css/map.css' %}">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <script src="{% static 'spaces/js/map.js' %}" defer></script>
</head>
<body class="map-page">
    <nav class="navbar bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">StudySmart</span>
            <span class="navbar-text small d-none d-sm-inline">Libraries and cafés for studying in Dublin</span>
        </div>
    </nav>

    <main class="map-wrapper">
        <div id="map" class="map" role="region" aria-label="Map of Dublin libraries and cafés"
             data-spaces-url="{% url 'spaces:studyspace-list' %}"
             data-areas-url="{% url 'spaces:area-list' %}"></div>

        <!-- Loading, empty and error messages are added here by map.js. -->
        <div id="map-messages" class="map-messages" role="status" aria-live="polite">
            <noscript><div class="alert alert-warning">The map needs JavaScript to be enabled.</div></noscript>
        </div>

        <div class="map-panel">
            <section id="selected-location" class="card" aria-label="Selected search location" hidden>
                <p class="mb-1">Selected location:<br><span id="selected-coordinates"></span></p>
                <button type="button" id="clear-selection" class="btn btn-sm btn-outline-secondary">Clear</button>
            </section>

            <section class="card" aria-labelledby="legend-heading">
                <h2 id="legend-heading" class="h6 mb-1">Legend</h2>
                <ul class="map-legend">
                    <li><span class="space-marker space-marker--library" aria-hidden="true">L</span>
                        Library <span id="library-count" class="text-body-secondary"></span></li>
                    <li><span class="space-marker space-marker--cafe" aria-hidden="true">C</span>
                        Café <span id="cafe-count" class="text-body-secondary"></span></li>
                </ul>
                <p class="map-hint mb-0">Click the map to choose a search location.</p>
            </section>
        </div>
    </main>
</body>
</html>
