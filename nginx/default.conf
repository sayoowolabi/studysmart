# OSM's tile policy blocks browser requests without a Referer. The admin's map widget cannot set a
# referrer policy on its tiles (the main map does, in map.js), so admin pages send other sites just our origin.
map $uri $referrer_policy {
    default same-origin;
    ~^/admin/ strict-origin-when-cross-origin;
}

# Public entry point: serves collected static files itself and passes everything else to Gunicorn.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Slightly above Django's 2.5 MB request limit, so Django reports oversized forms itself.
    client_max_body_size 5m;

    # Ask Docker's DNS for the address of web on each request (through the variable used in
    # proxy_pass). Otherwise recreating the web container would leave Nginx with its old address.
    resolver 127.0.0.11 valid=10s;
    set $django_upstream http://web:8000;

    # Inherited by the locations below because neither of them uses add_header itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy $referrer_policy always;
    add_header X-Frame-Options "DENY" always;

    location /static/ {
        alias /app/staticfiles/;
        # File names contain no content hash, so a week rather than a year (or "immutable"):
        # returning visitors still pick up changed JavaScript and CSS without a hard refresh.
        expires 7d;
    }

    location / {
        proxy_pass $django_upstream;
        # $http_host keeps the port. Django's CSRF check compares the browser's Origin
        # (http://localhost:8000) with this header, so $host would make admin logins fail.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Django sends these too; without hiding them each header would reach the browser twice.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
    }
}
